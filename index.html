<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ヘルパー申込">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <title>ヘルパー申込</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>ヘルパー申込</h1>
      <div class="who" id="who"></div>
    </div>
    <button class="icon-btn" id="help-btn" aria-label="使い方・困ったとき">？</button>
  </header>

  <main id="view">
    <noscript><p>このアプリを使うには、JavaScript を有効にしてください。</p></noscript>
    <p class="muted" id="boot-msg">読み込んでいます…</p>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button role="tab" data-tab="make" aria-selected="true"><span class="ic">📝</span>申込書をつくる</button>
    <button role="tab" data-tab="history" aria-selected="false"><span class="ic">🗂️</span>作成履歴</button>
    <button role="tab" data-tab="settings" aria-selected="false"><span class="ic">⚙️</span>設定</button>
  </nav>

  <div id="layer"></div>

  <script>
    // 古いブラウザ（モジュールが動かない）ときの案内
    window.__bootTimer = setTimeout(function () {
      var m = document.getElementById("boot-msg");
      if (m) m.textContent = "読み込みに時間がかかっています。電波の良いところで開き直してください。何度やっても進まないときは、iPhoneはSafari、AndroidはChromeで開いてください。";
    }, 15000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
